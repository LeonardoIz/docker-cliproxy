# Packages the upstream vayungodara/cliproxy-rs Linux release binaries (no fork, no compile)
# on top of the LinuxServer.io Ubuntu base, and pushes a multi-arch image to GHCR.
# Every 6 hours: builds the latest upstream release if its image is missing.
# Weekly: rebuilds it anyway, to pick up base image (security) updates.
name: docker

on:
  schedule:
    - cron: "17 */6 * * *"
    - cron: "41 3 * * 1"
  push:
    branches: [main]
    paths: [Dockerfile, root/**, .github/workflows/docker.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: "Upstream tag to build (empty = latest release)"
        required: false
      force:
        description: "Rebuild even if the image already exists"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker
  cancel-in-progress: false

env:
  UPSTREAM: vayungodara/cliproxy-rs

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          # a change to this repo or the weekly run always rebuilds
          FORCE: ${{ inputs.force || github.event_name == 'push' || github.event.schedule == '41 3 * * 1' }}
        run: |
          set -euo pipefail
          latest=$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)
          tag=${INPUT_TAG:-$latest}
          [[ $tag =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad tag: $tag"; exit 1; }
          image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cliproxy-rs
          version=${tag#v}
          tags="$image:$version"
          # Moving tags only follow the latest release, so a manual rebuild of an old tag never moves them.
          if [[ $tag == "$latest" && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tags="$tags,$image:${version%.*},$image:latest"
          fi
          if [[ $FORCE != true ]] && docker manifest inspect "$image:$version" >/dev/null 2>&1; then
            build=false; echo "$image:$version already exists, skipping"
          else
            build=true
          fi
          { echo "tag=$tag"; echo "image=$image:$version"; echo "tags=$tags"; echo "build=$build"
            echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } >> "$GITHUB_OUTPUT"
      - if: steps.r.outputs.build == 'true'
        uses: actions/checkout@v7
      - if: steps.r.outputs.build == 'true'
        uses: docker/setup-qemu-action@v4
      - if: steps.r.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4
      - if: steps.r.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          tags: ${{ steps.r.outputs.tags }}
          build-args: |
            CLIPROXY_RELEASE=${{ steps.r.outputs.tag }}
            VERSION=${{ steps.r.outputs.tag }}
            BUILD_DATE=${{ steps.r.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.url=https://github.com/${{ env.UPSTREAM }}
            org.opencontainers.image.version=${{ steps.r.outputs.tag }}
            org.opencontainers.image.created=${{ steps.r.outputs.date }}
            org.opencontainers.image.licenses=MIT
      - name: Smoke test
        if: steps.r.outputs.build == 'true'
        env:
          IMAGE: ${{ steps.r.outputs.image }}
        run: |
          for p in linux/amd64 linux/arm64; do
            docker run --rm --platform "$p" --entrypoint cliproxy "$IMAGE" --version
          done
